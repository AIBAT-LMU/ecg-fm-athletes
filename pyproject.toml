[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecg-fm-athletes"
version = "1.0.0"
description = "Code for 'ECG foundation models for cardiovascular screening in a cohort of young competitive athletes' (npj Digital Medicine, 2026)"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { file = "LICENSE" }
authors = [{ name = "AI-based Telemonitoring Group (AIBAT), LMU University Hospital Munich" }]
dependencies = [
    # deep learning
    "torch==2.8.0",
    "torchmetrics==1.8.1",
    "transformers==4.55.2",
    "huggingface-hub==0.34.4",
    "fairseq-signals",          # ECG-FM, pinned to a commit below
    "hydra-core==1.1.2",        # required by fairseq-signals
    "omegaconf==2.1.2",
    # scientific stack
    "numpy==2.2.6",
    "pandas==2.3.1",
    "scipy==1.15.3",
    "scikit-learn==1.7.1",
    "scikit-multilearn==0.2.0",
    "statsmodels==0.15.0",      # not in the original env; confirm against reference freeze
    # ECG / data I/O
    "wfdb==4.3.0",
    "h5py==3.16.0",             # not in the original env; confirm against reference freeze
    "openpyxl==3.1.5",
    "pandarallel==1.6.5",
    "thefuzz==0.22.1",
    "PyYAML==6.0.2",
    # logging and tracking
    "loguru==0.7.3",
    "mlflow==3.2.0",
    "tqdm==4.67.1",
    # figures
    "matplotlib==3.10.5",
    "seaborn==0.13.2",
]

[dependency-groups]
dev = ["black==25.1.0", "flake8==7.3.0", "isort==6.0.1", "pytest==8.4.1", "nbstripout==0.9.2"]

[tool.uv]
# Linux only (the published results were produced on Linux x86_64 with CUDA 12.8)
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
fairseq-signals = { git = "https://github.com/Jwoo5/fairseq-signals", rev = "571a124042566adf073c7198236f8714d9529772" }

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ecgath"]

[tool.black]
line-length = 99

[tool.isort]
profile = "black"
known_first_party = ["ecgath"]
force_sort_within_sections = true
[tool.pytest.ini_options]
testpaths = ["tests"]
